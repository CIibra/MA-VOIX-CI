/* ---- Stockage local (remplace window.storage de l'environnement Claude) ---- */
window.storage = {
  get: async (key, shared) => {
    const raw = localStorage.getItem("ocistore:" + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    localStorage.setItem("ocistore:" + key, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    localStorage.removeItem("ocistore:" + key);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix) => {
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith("ocistore:" + (prefix || "")))
      .map((k) => k.replace("ocistore:", ""));
    return { keys };
  },
};

/* =========================================================================
   MOTEUR DE RECOMMANDATION
   ========================================================================= */

function computeDomainScores(answers) {
  const scores = {};
  DOMAINES.forEach((d) => (scores[d.id] = 0));
  answers.forEach((optIndex, qIndex) => {
    if (optIndex === null || optIndex === undefined) return;
    const opt = QUESTIONS[qIndex].options[optIndex];
    Object.entries(opt.poids).forEach(([dom, val]) => {
      scores[dom] = (scores[dom] || 0) + val;
    });
  });
  const max = Math.max(1, ...Object.values(scores));
  const pct = {};
  Object.entries(scores).forEach(([k, v]) => (pct[k] = Math.round((v / max) * 100)));
  return pct;
}

function computeMetierScores(domainPct) {
  return METIERS.map((m) => {
    const primary = domainPct[m.domaine] || 0;
    const secondary = m.domaineSecondaire ? (domainPct[m.domaineSecondaire] || 0) : 0;
    const score = Math.round(primary * 0.75 + secondary * 0.25);
    return { metier: m, score };
  }).sort((a, b) => b.score - a.score);
}

function niveauRange(str) {
  if (!str) return { min: 1, max: 1 };
  if (/CQP/i.test(str)) return { min: 0, max: 1 };
  const nums = [...str.matchAll(/Bac\+(\d)/g)].map((m) => parseInt(m[1], 10));
  if (nums.length === 0) {
    if (/Bac/i.test(str)) return { min: 1, max: 1 };
    return { min: 1, max: 3 };
  }
  return { min: Math.min(...nums), max: Math.max(...nums) };
}

function Quiz({ setView }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState(Array(QUESTIONS.length).fill(null));

  const q = QUESTIONS[step];
  const progress = Math.round(((step) / QUESTIONS.length) * 100);

  const choose = (idx) => {
    const next = [...answers];
    next[step] = idx;
    setAnswers(next);
    setTimeout(() => {
      if (step < QUESTIONS.length - 1) setStep(step + 1);
      else {
        const pct = computeDomainScores(next);
        setView({ name: "resultats", pct });
      }
    }, 180);
  };

  return (
    <div className="max-w-2xl mx-auto px-5 py-12 oci-fade">
      <div className="flex items-center justify-between text-sm mb-2" style={{ color: COLORS.inkSoft }}>
        <span>Question {step + 1} / {QUESTIONS.length}</span>
        <button onClick={() => setView({ name: "home" })} className="oci-focus flex items-center gap-1"><X size={14} /> Quitter</button>
      </div>
      <div className="w-full h-1.5 rounded-full mb-8" style={{ background: COLORS.line }}>
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${progress}%`, background: COLORS.green }} />
      </div>

      <h2 className="oci-display text-2xl md:text-3xl mb-6" style={{ color: COLORS.ink }}>{q.texte}</h2>

      <div className="grid gap-2.5">
        {q.options.map((opt, idx) => (
          <button
            key={opt.texte}
            onClick={() => choose(idx)}
            className="oci-focus text-left px-4 py-3.5 rounded-xl border transition-colors"
            style={{
              borderColor: answers[step] === idx ? COLORS.green : COLORS.line,
              background: answers[step] === idx ? COLORS.greenSoft : COLORS.card,
              color: COLORS.ink,
            }}
          >
            {opt.texte}
          </button>
        ))}
      </div>

      {step > 0 && (
        <button onClick={() => setStep(step - 1)} className="oci-focus mt-6 text-sm flex items-center gap-1" style={{ color: COLORS.inkSoft }}>
          <ChevronLeft size={15} /> Question précédente
        </button>
      )}
    </div>
  );
}

function FormationsSearch({ setView }) {
  const [q, setQ] = useState("");
  const [domFilter, setDomFilter] = useState(null);

  const results = useMemo(() => {
    return FORMATIONS.filter((f) => {
      const matchQ = q.trim() === "" || f.nom.toLowerCase().includes(q.toLowerCase());
      const matchDom = !domFilter || f.domaine === domFilter;
      return matchQ && matchDom;
    });
  }, [q, domFilter]);

  return (
    <div className="max-w-5xl mx-auto px-5 py-12 oci-fade">
      <SectionTitle eyebrow="Je connais ma formation" title="Recherche une formation" sub="BTS, Licence, CQP, diplôme d'ingénieur... découvre les métiers accessibles et les poursuites d'études." />

      <div className="relative mb-5">
        <SearchIcon size={17} className="absolute left-4 top-1/2 -translate-y-1/2" color={COLORS.inkSoft} />
        <input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="Ex : Licence Informatique, BTS Génie Civil, CQP Électricien..."
          className="oci-focus w-full pl-11 pr-4 py-3.5 rounded-xl border text-sm"
          style={{ borderColor: COLORS.line, background: COLORS.card }}
        />
      </div>

      <div className="flex flex-wrap gap-2 mb-8">
        <Pill tone="green" active={!domFilter} onClick={() => setDomFilter(null)} small>Tous</Pill>
        {DOMAINES.map((d) => (
          <Pill key={d.id} tone="green" active={domFilter === d.id} onClick={() => setDomFilter(d.id === domFilter ? null : d.id)} small>{d.nom}</Pill>
        ))}
      </div>

      <div className="text-sm mb-3" style={{ color: COLORS.inkSoft }}>{results.length} formation(s)</div>
      <div className="grid sm:grid-cols-2 gap-3">
        {results.map((f) => (
          <Card key={f.id} onClick={() => setView({ name: "formation", id: f.id })} className="p-4 hover:shadow-sm transition-shadow">
            <div className="font-semibold text-sm" style={{ color: COLORS.ink }}>{f.nom}</div>
            <div className="text-xs mt-1" style={{ color: COLORS.orange }}>{f.niveau} · {f.diplome}</div>
            <div className="text-xs mt-2" style={{ color: COLORS.inkSoft }}>{domNom(f.domaine)}</div>
          </Card>
        ))}
        {results.length === 0 && <div className="text-sm col-span-full" style={{ color: COLORS.inkSoft }}>Aucune formation trouvée.</div>}
      </div>
    </div>
  );
}

function Etudiant({ setView }) {
  const [domaine, setDomaine] = useState(null);
  const [niveau, setNiveau] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  if (!submitted) {
    return (
      <div className="max-w-2xl mx-auto px-5 py-12 oci-fade">
        <SectionTitle eyebrow="Je suis déjà étudiant" title="Où en es-tu ?" sub="Indique ton domaine actuel et ton niveau : on te montre les métiers accessibles, les poursuites d'études et les passerelles vers d'autres domaines." />

        <div className="mb-6">
          <div className="text-sm font-medium mb-2.5" style={{ color: COLORS.ink }}>Ton domaine d'études actuel</div>
          <div className="flex flex-wrap gap-2">
            {DOMAINES.map((d) => (
              <Pill key={d.id} tone="green" active={domaine === d.id} onClick={() => setDomaine(d.id)}>{d.nom}</Pill>
            ))}
          </div>
        </div>

        <div className="mb-8">
          <div className="text-sm font-medium mb-2.5" style={{ color: COLORS.ink }}>Ton niveau actuel</div>
          <div className="flex flex-wrap gap-2">
            {NIVEAUX_ETUDIANT.map((n) => (
              <Pill key={n.id} tone="orange" active={niveau === n.id} onClick={() => setNiveau(n.id)}>{n.label}</Pill>
            ))}
          </div>
        </div>

        <button
          disabled={!domaine || !niveau}
          onClick={() => setSubmitted(true)}
          className="oci-focus text-sm px-6 py-3 rounded-full text-white disabled:opacity-40"
          style={{ background: COLORS.green }}
        >
          Voir mes possibilités
        </button>
      </div>
    );
  }

  const metiersDomaine = METIERS.filter((m) => m.domaine === domaine);
  const metiersAccessibles = metiersDomaine.filter((m) => niveauRange(m.niveau).min <= niveau);
  const formationsDomaine = FORMATIONS.filter((f) => f.domaine === domaine);
  const formationsSuite = formationsDomaine.filter((f) => niveauRange(f.niveau).max > niveau);
  const passerelles = (ADJACENT_DOMAINS[domaine] || []).slice(0, 3);

  return (
    <div className="max-w-4xl mx-auto px-5 py-12 oci-fade">
      <button onClick={() => setSubmitted(false)} className="oci-focus text-sm flex items-center gap-1 mb-6" style={{ color: COLORS.inkSoft }}>
        <ChevronLeft size={15} /> Modifier ma situation
      </button>
      <div className="text-sm mb-1" style={{ color: COLORS.orange }}>{domNom(domaine)} · {NIVEAUX_ETUDIANT.find((n) => n.id === niveau)?.label}</div>
      <h1 className="oci-display text-3xl md:text-4xl mb-8" style={{ color: COLORS.ink }}>Tes possibilités à partir d'ici</h1>

      <div className="mb-8">
        <div className="font-semibold mb-3" style={{ color: COLORS.ink }}>Métiers déjà accessibles</div>
        {metiersAccessibles.length > 0 ? (
          <div className="grid sm:grid-cols-2 gap-3">
            {metiersAccessibles.map((m) => (
              <Card key={m.id} onClick={() => setView({ name: "metier", id: m.id })} className="p-4 hover:shadow-sm transition-shadow">
                <div className="font-semibold text-sm" style={{ color: COLORS.ink }}>{m.nom}</div>
                <div className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>{m.niveau}</div>
              </Card>
            ))}
          </div>
        ) : (
          <p className="text-sm" style={{ color: COLORS.inkSoft }}>Pas encore de métier accessible à ce niveau dans ce domaine — continue tes études pour en débloquer.</p>
        )}
      </div>

      <div className="mb-8">
        <div className="font-semibold mb-3" style={{ color: COLORS.ink }}>Formations de poursuite dans ton domaine</div>
        {formationsSuite.length > 0 ? (
          <div className="grid sm:grid-cols-2 gap-3">
            {formationsSuite.map((f) => (
              <Card key={f.id} onClick={() => setView({ name: "formation", id: f.id })} className="p-4 hover:shadow-sm transition-shadow">
                <div className="font-semibold text-sm" style={{ color: COLORS.ink }}>{f.nom}</div>
                <div className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>{f.niveau} · {f.diplome}</div>
              </Card>
            ))}
          </div>
        ) : (
          <p className="text-sm" style={{ color: COLORS.inkSoft }}>Tu es déjà au niveau le plus avancé référencé dans ce domaine.</p>
        )}
      </div>

      <div>
        <div className="font-semibold mb-3" style={{ color: COLORS.ink }}>Passerelles vers d'autres domaines</div>
        <p className="text-sm mb-3" style={{ color: COLORS.inkSoft }}>Ces domaines partagent des compétences avec le tien — une réorientation y serait plus naturelle qu'ailleurs.</p>
        <div className="flex flex-wrap gap-2">
          {passerelles.map((did) => (
            <Pill key={did} tone="orange" onClick={() => setView({ name: "reorientation" })}>{domNom(did)}</Pill>
          ))}
        </div>
      </div>
    </div>
  );
}

function Reorientation({ setView }) {
  const [domaineActuel, setDomaineActuel] = useState(null);
  const [domaineCible, setDomaineCible] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  if (!submitted) {
    return (
      <div className="max-w-2xl mx-auto px-5 py-12 oci-fade">
        <SectionTitle eyebrow="Je veux me réorienter" title="D'où tu viens, où tu veux aller" sub="Indique ta situation actuelle et le domaine qui t'attire : on te propose des formations et métiers pour t'en rapprocher." />

        <div className="mb-6">
          <div className="text-sm font-medium mb-2.5" style={{ color: COLORS.ink }}>Ton domaine actuel</div>
          <div className="flex flex-wrap gap-2">
            {DOMAINES.map((d) => (
              <Pill key={d.id} tone="green" active={domaineActuel === d.id} onClick={() => setDomaineActuel(d.id)}>{d.nom}</Pill>
            ))}
          </div>
        </div>

        <div className="mb-8">
          <div className="text-sm font-medium mb-2.5" style={{ color: COLORS.ink }}>Le domaine qui t'attire</div>
          <div className="flex flex-wrap gap-2">
            {DOMAINES.filter((d) => d.id !== domaineActuel).map((d) => (
              <Pill key={d.id} tone="orange" active={domaineCible === d.id} onClick={() => setDomaineCible(d.id)}>{d.nom}</Pill>
            ))}
          </div>
        </div>

        <button
          disabled={!domaineActuel || !domaineCible}
          onClick={() => setSubmitted(true)}
          className="oci-focus text-sm px-6 py-3 rounded-full text-white disabled:opacity-40"
          style={{ background: COLORS.green }}
        >
          Voir les passerelles possibles
        </button>
      </div>
    );
  }

  const formationsCibles = FORMATIONS.filter((f) => f.domaine === domaineCible).sort((a, b) => niveauRange(a.niveau).min - niveauRange(b.niveau).min);
  const metiersCibles = METIERS.filter((m) => m.domaine === domaineCible);
  const estAdjacent = (ADJACENT_DOMAINS[domaineActuel] || []).includes(domaineCible);

  return (
    <div className="max-w-4xl mx-auto px-5 py-12 oci-fade">
      <button onClick={() => setSubmitted(false)} className="oci-focus text-sm flex items-center gap-1 mb-6" style={{ color: COLORS.inkSoft }}>
        <ChevronLeft size={15} /> Modifier ma situation
      </button>
      <div className="text-sm mb-1" style={{ color: COLORS.orange }}>{domNom(domaineActuel)} → {domNom(domaineCible)}</div>
      <h1 className="oci-display text-3xl md:text-4xl mb-4" style={{ color: COLORS.ink }}>Se rapprocher de {domNom(domaineCible).toLowerCase()}</h1>

      <Card className="p-5 mb-8" style={{ background: estAdjacent ? COLORS.greenSoft : COLORS.orangeSoft }}>
        <p className="text-sm" style={{ color: COLORS.ink }}>
          {estAdjacent
            ? "Bonne nouvelle : ce domaine partage des compétences avec le tien, la transition devrait être assez naturelle."
            : "Ce changement est plus important — il te faudra probablement repartir d'une formation d'entrée dans ce domaine plutôt que d'une passerelle directe."}
        </p>
      </Card>

      <div className="mb-8">
        <div className="font-semibold mb-3" style={{ color: COLORS.ink }}>Formations pour entrer dans ce domaine</div>
        <div className="grid sm:grid-cols-2 gap-3">
          {formationsCibles.slice(0, 6).map((f) => (
            <Card key={f.id} onClick={() => setView({ name: "formation", id: f.id })} className="p-4 hover:shadow-sm transition-shadow">
              <div className="font-semibold text-sm" style={{ color: COLORS.ink }}>{f.nom}</div>
              <div className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>{f.niveau} · {f.acces}</div>
            </Card>
          ))}
        </div>
      </div>

      <div>
        <div className="font-semibold mb-3" style={{ color: COLORS.ink }}>Métiers accessibles dans ce domaine</div>
        <div className="flex flex-wrap gap-2">
          {metiersCibles.map((m) => (
            <Pill key={m.id} tone="green" onClick={() => setView({ name: "metier", id: m.id })}>{m.nom}</Pill>
          ))}
        </div>
      </div>
    </div>
  );
}

function Comparateur({ compareList, toggleCompare }) {
  if (compareList.length === 0) {
    return (
      <div className="max-w-3xl mx-auto px-5 py-12 oci-fade">
        <SectionTitle eyebrow="Comparateur" title="Rien à comparer pour l'instant" sub="Ajoute des métiers ou des formations au comparateur depuis leur fiche, puis reviens ici." />
      </div>
    );
  }

  const items = compareList.map((c) => (c.type === "metier" ? { ...c, data: metierById(c.id) } : { ...c, data: formationById(c.id) }));

  const rowsMetier = [
    ["Domaine", (d) => domNom(d.domaine)],
    ["Niveau d'études", (d) => d.niveau],
    ["Compétences clés", (d) => d.competences.join(", ")],
    ["Où travailler", (d) => d.ou.join(", ")],
  ];
  const rowsFormation = [
    ["Domaine", (d) => domNom(d.domaine)],
    ["Diplôme", (d) => d.diplome],
    ["Durée", (d) => d.duree],
    ["Accès", (d) => d.acces],
    ["Poursuites", (d) => d.poursuites],
  ];

  return (
    <div className="max-w-5xl mx-auto px-5 py-12 oci-fade">
      <SectionTitle eyebrow="Comparateur" title="Comparer tes options" />
      <div className="overflow-x-auto oci-scroll">
        <table className="w-full text-sm border-separate" style={{ borderSpacing: "0 8px" }}>
          <thead>
            <tr>
              <th className="text-left px-2" style={{ color: COLORS.inkSoft }}></th>
              {items.map((it) => (
                <th key={it.id} className="text-left px-3 py-2 min-w-[200px]">
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-semibold" style={{ color: COLORS.ink }}>{it.data.nom}</span>
                    <button onClick={() => toggleCompare(it)} className="oci-focus"><X size={14} color={COLORS.inkSoft} /></button>
                  </div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {(items[0].type === "metier" ? rowsMetier : rowsFormation).map(([label, get]) => (
              <tr key={label}>
                <td className="px-2 py-2 align-top text-xs whitespace-nowrap" style={{ color: COLORS.inkSoft }}>{label}</td>
                {items.map((it) => (
                  <td key={it.id} className="px-3 py-2 align-top rounded-xl" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}>
                    {it.data ? get(it.data) : "—"}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */

function App() {
  const [view, setView] = useState({ name: "home" });
  const [compareList, setCompareList] = useState([]);
  const [favoris, setFavoris] = useState([]);
  const [favorisLoading, setFavorisLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await window.storage.get("favoris", false);
        if (!cancelled && res?.value) setFavoris(JSON.parse(res.value));
      } catch (e) {
        // pas encore de favoris enregistrés, ou stockage indisponible : on part d'une liste vide
      } finally {
        if (!cancelled) setFavorisLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const toggleFavori = (item) => {
    setFavoris((prev) => {
      const exists = prev.some((f) => f.type === item.type && f.id === item.id);
      const next = exists ? prev.filter((f) => !(f.type === item.type && f.id === item.id)) : [...prev, item];
      window.storage.set("favoris", JSON.stringify(next), false).catch(() => {});
      return next;
    });
  };

  const toggleCompare = (item) => {
    setCompareList((prev) => {
      const exists = prev.some((c) => c.type === item.type && c.id === item.id);
      if (exists) return prev.filter((c) => !(c.type === item.type && c.id === item.id));
      const sameType = prev.filter((c) => c.type === item.type);
      if (sameType.length >= 3) return prev;
      return [...prev, item];
    });
  };

  let content;
  if (view.name === "home") content = <Home setView={setView} />;
  else if (view.name === "quiz") content = <Quiz setView={setView} />;
  else if (view.name === "resultats") content = <Resultats pct={view.pct} setView={setView} />;
  else if (view.name === "metiers") content = <MetiersSearch setView={setView} />;
  else if (view.name === "metier") content = <MetierFiche id={view.id} setView={setView} compareList={compareList} toggleCompare={toggleCompare} favoris={favoris} toggleFavori={toggleFavori} />;
  else if (view.name === "formations") content = <FormationsSearch setView={setView} />;
  else if (view.name === "formation") content = <FormationFiche id={view.id} setView={setView} compareList={compareList} toggleCompare={toggleCompare} favoris={favoris} toggleFavori={toggleFavori} />;
  else if (view.name === "explorer") content = <Explorer setView={setView} />;
  else if (view.name === "etudiant") content = <Etudiant setView={setView} />;
  else if (view.name === "reorientation") content = <Reorientation setView={setView} />;
  else if (view.name === "favoris") content = <Favoris favoris={favoris} setView={setView} toggleFavori={toggleFavori} loading={favorisLoading} />;
  else if (view.name === "comparateur") content = <Comparateur compareList={compareList} toggleCompare={toggleCompare} />;
  else content = <Home setView={setView} />;

  return (
    <div className="oci-root min-h-screen">
      <GlobalStyle />
      <Header view={view} setView={setView} />
      {content}
      <footer className="border-t mt-10" style={{ borderColor: COLORS.line }}>
        <div className="max-w-6xl mx-auto px-5 py-8 text-xs flex flex-wrap items-center justify-between gap-3" style={{ color: COLORS.inkSoft }}>
          <span>Ma Voie CI — Gratuit, sans compte. Les résultats sont des pistes d'aide à la décision, pas des décisions définitives.</span>
          <div className="flex items-center gap-2">
            {favoris.length > 0 && (
              <button onClick={() => setView({ name: "favoris" })} className="oci-focus px-3 py-1.5 rounded-full border flex items-center gap-1.5" style={{ borderColor: COLORS.line, color: COLORS.ink }}>
                <Heart size={13} /> Favoris ({favoris.length})
              </button>
            )}
            {compareList.length > 0 && (
              <button onClick={() => setView({ name: "comparateur" })} className="oci-focus px-3 py-1.5 rounded-full border flex items-center gap-1.5" style={{ borderColor: COLORS.line, color: COLORS.ink }}>
                <Scale size={13} /> Comparateur ({compareList.length})
              </button>
            )}
          </div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
<script>
  // On transpile nous-mêmes avec le runtime "classic" (React.createElement),
  // pour éviter le runtime "automatic" par défaut qui insère un import ES module
  // que le navigateur ne peut pas exécuter dans un <script> classique.
  (function () {
    var source = document.getElementById("app-source").textContent;
    try {
      var result = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      });
      var script = document.createElement("script");
      script.text = result.code;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="white-space:pre-wrap;padding:20px;color:#a00;font-family:monospace;">Erreur au chargement de l\'application :\n' +
        (e && e.message ? e.message : e) + '</pre>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
